<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deuce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{--night:#070B0F;--ink:#F2EAE0;--dim:#7E8785;--ball:#DCEC4E;
    --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
    --board:"Bebas Neue","Arial Narrow",Impact,sans-serif;}
  :root:not([data-theme="light"]){color-scheme:dark;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:var(--night);color:var(--ink);font-family:var(--serif);overflow-x:hidden;overscroll-behavior-y:none;}
  .stage{position:fixed;inset:0;display:flex;justify-content:center;background:var(--night);z-index:1;}
  .frame{position:relative;width:100%;max-width:560px;height:100%;overflow:hidden;}
  svg.court{width:100%;height:100%;display:block;}

  .camlayer{position:absolute;inset:0;z-index:4;transform-origin:0 0;pointer-events:none;will-change:transform;}
  .credit{font-family:var(--board);font-size:11px;letter-spacing:.24em;color:#5E6664;margin-top:18px;}
  .tapcue{position:absolute;z-index:7;left:0;right:0;top:56%;text-align:center;opacity:0;pointer-events:none;
    transition:opacity .4s ease;font-family:var(--board);letter-spacing:.2em;}
  .tapcue.on{opacity:1;}
  .tapcue .ring{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;border:2px solid var(--ball);
    animation:pulse 1.25s ease-out infinite;}
  .tapcue .lbl{font-size:13px;color:var(--ball);}
  @keyframes pulse{0%{transform:scale(.72);opacity:1}100%{transform:scale(1.5);opacity:0}}
  .card{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:rgba(4,7,10,.96);opacity:0;pointer-events:none;transition:opacity .8s ease;padding:24px;}
  .card.on{opacity:1;pointer-events:auto;}
  .card .inner{width:100%;max-width:340px;border:1px solid rgba(242,234,224,.18);border-radius:4px;
    background:linear-gradient(180deg,#0C141B,#070B0F);padding:26px 24px;text-align:center;}
  .card .top{font-family:var(--board);font-size:11px;letter-spacing:.34em;color:#6E7674;}
  .card .nm{font-family:var(--board);font-size:clamp(28px,8vw,38px);letter-spacing:.05em;color:#fff;line-height:1.05;margin-top:14px;}
  .card .nm small{display:block;font-size:12px;letter-spacing:.34em;color:#6E7674;margin:6px 0;}
  .card .res{font-family:var(--board);font-size:15px;letter-spacing:.16em;color:#1A2005;background:var(--ball);
    display:inline-block;padding:6px 14px;border-radius:2px;margin-top:18px;}
  .card .meta{font-size:17px;line-height:1.5;color:#E9E2D8;margin-top:18px;font-style:italic;}
  .card .foot{font-family:var(--board);font-size:10px;letter-spacing:.26em;color:#4E5654;margin-top:22px;}
  .card .share{font-family:var(--board);font-size:12px;letter-spacing:.16em;color:#1A2005;background:var(--ball);
    border:1px solid var(--ball);border-radius:999px;padding:11px 18px;margin-top:18px;cursor:pointer;}
  .card .share:hover{filter:brightness(1.08);}
  .card .share:focus-visible{outline:2px solid #fff;outline-offset:3px;}
  .ledWrap{position:absolute;z-index:4;pointer-events:none;background:#07090C;
    border:1px solid rgba(255,177,46,.16);border-radius:2px;
    box-shadow:0 0 40px rgba(255,150,20,.16),inset 0 0 26px rgba(0,0,0,.85);overflow:hidden;}
  .ledWrap canvas{display:block;width:100%;height:100%;}

  .hud{position:absolute;z-index:6;left:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:flex-end;gap:8px;transition:opacity .5s ease,transform .5s ease;}
  .hud.hide{opacity:0;transform:translateY(10px);pointer-events:none;}
  .tv{font-family:var(--board);letter-spacing:.045em;
    background:linear-gradient(180deg,rgba(11,17,23,.95),rgba(6,10,14,.97));
    border:1px solid rgba(242,234,224,.14);border-radius:3px;overflow:hidden;
    box-shadow:0 6px 24px rgba(0,0,0,.65);display:flex;}
  .tv .accent{width:4px;background:#C8452E;}
  .tv .row{display:flex;align-items:center;height:25px;padding:0 8px 0 7px;gap:7px;}
  .tv .row+.row{border-top:1px solid rgba(242,234,224,.09);}
  .tv .dot{width:6px;height:6px;border-radius:50%;background:transparent;flex:none;}
  .tv .row.serving .dot{background:var(--ball);box-shadow:0 0 7px var(--ball);}
  .tv .who{font-size:15px;min-width:80px;color:#98A09D;transition:color .25s;}
  .tv .row.lead .who{color:#fff;}
  .tv .cell{font-size:15px;width:15px;text-align:center;color:#8B9391;}
  .tv .cell.games{color:#E9E2D8;}
  .tv .cell.pts{color:#fff;width:26px;background:rgba(242,234,224,.1);border-radius:2px;transition:background .4s,color .4s;}
  .tv .cell.pts.win{background:var(--ball);color:#1A2005;}
  .badge{font-family:var(--board);font-size:12px;letter-spacing:.17em;padding:5px 9px;border-radius:2px;
    background:#C8452E;color:#fff;white-space:nowrap;margin-bottom:2px;transition:background .4s;}
  .badge.deuce{background:#2E6E78;}
  .badge.won{background:var(--ball);color:#1A2005;}
  .speed{font-family:var(--board);font-size:12px;letter-spacing:.14em;padding:5px 9px;border-radius:2px;
    background:rgba(11,17,23,.9);border:1px solid rgba(242,234,224,.16);color:var(--ball);
    margin-bottom:2px;opacity:0;transition:opacity .4s;white-space:nowrap;}
  .speed.on{opacity:1;}

  .ask{position:absolute;z-index:7;left:0;right:0;bottom:0;
    padding:110px 9% calc(28px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(5,9,13,.88) 34%,rgba(5,9,13,.99));}
  .ask p{font-size:clamp(19px,4.9vw,25px);line-height:1.44;font-style:italic;color:#fff;text-wrap:pretty;}
  .ask .btns{display:flex;gap:11px;margin-top:24px;flex-wrap:wrap;}
  .ask button{font-family:var(--board);font-size:17px;letter-spacing:.11em;padding:13px 26px;
    border-radius:999px;cursor:pointer;border:1px solid rgba(242,234,224,.34);background:transparent;
    color:var(--ink);transition:background .18s,color .18s,border-color .18s;}
  .ask button.primary{background:var(--ball);color:#1A2005;border-color:var(--ball);}
  .ask button:hover{background:var(--ball);color:#1A2005;border-color:var(--ball);}
  .ask button:focus-visible{outline:2px solid var(--ball);outline-offset:3px;}
  .ask.on{opacity:1;pointer-events:auto;}

  .pick{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;
    padding:0 7% calc(30px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(5,9,13,0) 18%,rgba(5,9,13,.88) 46%,rgba(5,9,13,.99));
    opacity:0;pointer-events:none;transition:opacity .9s ease;}
  .pick.on{opacity:1;pointer-events:auto;}
  .pick .lead{font-size:clamp(17px,4.4vw,21px);font-style:italic;color:#C9D0CD;margin-bottom:5px;}
  .venue{display:block;width:100%;text-align:left;cursor:pointer;padding:12px 14px;border-radius:3px;
    background:linear-gradient(180deg,rgba(14,22,29,.94),rgba(7,12,17,.96));
    border:1px solid rgba(242,234,224,.16);border-left:4px solid #C8452E;
    transition:border-color .2s,background .2s,transform .2s;}
  .venue:nth-child(3){border-left-color:#B8912E;}
  .venue:nth-child(4){border-left-color:#2E6E78;}
  .venue:hover,.venue:focus-visible{background:rgba(24,36,46,.97);transform:translateX(3px);outline:none;
    border-color:rgba(220,236,78,.5);}
  .venue .vn{display:block;font-family:var(--board);font-size:20px;letter-spacing:.05em;color:#fff;line-height:1.1;}
  .venue .va{display:block;font-family:var(--board);font-size:12px;letter-spacing:.2em;color:var(--ball);margin-top:2px;}
  .venue .vd{display:block;font-size:15px;line-height:1.35;color:#98A09D;margin-top:6px;}

  .endc{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 9% calc(34px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(5,9,13,0) 30%,rgba(5,9,13,.9) 60%,rgba(5,9,13,.99));
    opacity:0;pointer-events:none;transition:opacity 1.1s ease;}
  .endc.on{opacity:1;pointer-events:auto;}
  .endc .verdict{font-family:var(--board);font-size:clamp(36px,10.5vw,58px);line-height:.95;
    color:var(--ball);margin-bottom:15px;letter-spacing:.02em;}
  .endc p{font-size:clamp(18px,4.6vw,23px);line-height:1.45;}
  .endc p+p{margin-top:12px;}
  .endc .again{margin-top:24px;align-self:flex-start;font-family:var(--board);font-size:15px;
    letter-spacing:.14em;padding:11px 22px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(242,234,224,.3);background:transparent;color:var(--dim);}
  .endc .again:hover{color:var(--ink);border-color:rgba(242,234,224,.6);}
  .endc .again:focus-visible{outline:2px solid var(--ball);outline-offset:3px;}

  .intro{position:fixed;inset:0;z-index:20;background:var(--night);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:24px;text-align:center;padding:30px;transition:opacity .9s ease;}
  .intro.gone{opacity:0;pointer-events:none;}
  .intro .tag{font-family:var(--board);font-size:12px;letter-spacing:.42em;color:#6A7371;}
  .intro .vs{font-family:var(--board);letter-spacing:.08em;line-height:1.1;}
  .intro .vs span{display:block;font-size:clamp(38px,11.5vw,60px);color:var(--ink);}
  .intro .vs .mid{font-size:13px;letter-spacing:.44em;color:#6A7371;margin:8px 0;}
  .intro .brief{font-size:clamp(16px,4.2vw,19px);color:#9AA19F;font-style:italic;max-width:32ch;line-height:1.5;}
  .intro .serve{font-family:var(--board);font-size:18px;letter-spacing:.16em;padding:16px 42px;
    border-radius:999px;cursor:pointer;background:var(--ball);color:#1A2005;border:none;}
  .intro .serve:focus-visible{outline:2px solid var(--ink);outline-offset:4px;}
  .intro .hint{font-family:var(--board);font-size:11px;letter-spacing:.24em;color:#535B59;}

  .cue{position:absolute;z-index:6;right:14px;bottom:calc(58px + env(safe-area-inset-bottom));
    text-align:right;font-family:var(--board);font-size:11px;letter-spacing:.3em;color:#69716F;
    opacity:0;transition:opacity .6s ease;pointer-events:none;}
  .cue.on{opacity:1;animation:breathe 2.6s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(5px);opacity:.95}}

  .snd{position:absolute;z-index:9;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));
    width:34px;height:34px;border-radius:50%;cursor:pointer;border:1px solid rgba(242,234,224,.18);
    background:rgba(7,11,15,.6);color:var(--dim);font-family:var(--board);font-size:11px;}
  .snd:focus-visible{outline:2px solid var(--ball);outline-offset:2px;}

  .track{position:relative;z-index:0;width:1px;}
  @keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .cc.cheering{animation:cheer .4s ease-in-out infinite;}
  @media (prefers-reduced-motion:reduce){.cue.on{animation:none;}.cc.cheering{animation:none;}}
</style>
</head>
<body>

  <div class="frame" id="frame">
    <svg class="court" id="svg" viewBox="0 0 400 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="clay" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0" stop-color="#C05E33"/><stop offset=".5" stop-color="#A54C29"/><stop offset="1" stop-color="#8A3E22"/></linearGradient>

          <stop offset="0" stop-color="#7C3620"/><stop offset=".75" stop-color="#46200F"/><stop offset="1" stop-color="#2A140C"/></linearGradient>

      <rect x="0" y="0" width="400" height="900" fill="url(#sky)"/>
      <g id="lightsG"></g>
      <g id="standG"></g>

      <g id="flashG"></g>
    </svg>

    <div class="camlayer" id="camlayer"><div class="ledWrap" id="ledWrap"><canvas id="led"></canvas></div></div>

    <div class="hud" id="hud">
      <div class="tv">
        <div class="accent"></div>
        <div>
          <div class="row serving lead" id="rowA">
            <span class="dot"></span><span class="who">Abhi</span>
            <span class="cell">1</span><span class="cell games" id="gA">5</span><span class="cell pts" id="pA">AD</span>
          </div>
          <div class="row" id="rowB">
            <span class="dot"></span><span class="who">Mounika</span>
            <span class="cell">1</span><span class="cell games" id="gB">4</span><span class="cell pts" id="pB">&ndash;</span>
          </div>
        </div>
      </div>
      <div class="badge" id="badge">Match point</div>
      <div class="speed" id="speed">196 km/h</div>
    </div>

    <div class="ask" id="ask">
      <p id="askText"></p>
      <div class="btns">
        <button class="primary" id="btnYes">Yes</button>
        <button id="btnAgain">Ask me again</button>
      </div>
    </div>

    <div class="pick" id="pick">
      <p class="lead">She said yes. Now she picks the court.</p>
      <button class="venue" data-v="0"><span class="vn">Roastery Coffee House</span><span class="va">Film Nagar</span><span class="vd">Garden seating, cranberry cold brew, and quiet enough to actually talk.</span></button>

</div>

var NEAR_Y=860, FAR_Y=300, NEAR_HW=186, FAR_HW=55, CX=200, F=1.7;
function warp(d){return d*(1+F)/(1+F*d);}
function cy(d){return NEAR_Y+(FAR_Y-NEAR_Y)*warp(d);}
function chw(d){return NEAR_HW+(FAR_HW-NEAR_HW)*warp(d);}
function csc(d){return 1+(0.30-1)*warp(d);}
function cxAt(d,u){return CX+u*chw(d);}
function up(d,h){return cy(d)-h*csc(d);}
function pt(d,u){return cxAt(d,u).toFixed(2)+","+cy(d).toFixed(2);}
var SG=0.82, SL_N=0.231, SL_F=0.769;

var clusters=[];
(function(){
  var g=document.getElementById("standG");
  var skins=["#E8B88F","#D8A377","#C08E64","#EFC49E","#CE9A70","#DCAE83"];
  var tops=["#16222E","#1F2833","#2C1F26","#1A2724","#332619","#241C2A","#1C2836","#332E2A","#1E231C"];
  var bright=["#C8452E","#2E6E78","#B8912E","#7A3A62","#DCD6C8","#3E6B3A"];
  function cluster(){
    var c=el("g",{"class":"cc"});
    c.style.animationDelay=(RND()*0.4).toFixed(3)+"s";
    c.style.animationDuration=(0.32+RND()*0.22).toFixed(3)+"s";
    g.appendChild(c); clusters.push(c); return c;
  }
  function person(gg,x,y,s,lit){
    var o=lit*(0.6+RND()*0.4);
    var tp=RND()<.15?bright[(RND()*bright.length)|0]:tops[(RND()*tops.length)|0];
    gg.appendChild(el("path",{d:"M "+(x-s*1.3)+" "+y+" q "+(s*1.3)+" "+(-s*2.4)+" "+(s*2.6)+" 0 z",fill:tp,opacity:o}));
    gg.appendChild(el("circle",{cx:x,cy:y-s*2.3,r:s,fill:skins[(RND()*skins.length)|0],opacity:o*.95}));
    gg.appendChild(el("path",{d:"M "+(x-s)+" "+(y-s*2.55)+" a "+s+" "+s+" 0 0 1 "+(s*2)+" 0 z",fill:"#120C0A",opacity:o*.85}));
  }
  var TIERS=7,U0=1.26,UW=0.30,HSTEP=30;
  function sideStand(side){
    for(var t=TIERS-1;t>=0;t--){
      var uIn=U0+t*UW,uOut=U0+(t+1)*UW,h=t*HSTEP,hN=(t+1)*HSTEP;
      var top=[],ris=[],risB=[];
      for(var d=-0.08;d<=1.42;d+=0.05){
        top.push(cxAt(d,uIn*side).toFixed(1)+","+up(d,h).toFixed(1));
        ris.push(cxAt(d,uOut*side).toFixed(1)+","+up(d,h).toFixed(1));
        risB.push(cxAt(d,uOut*side).toFixed(1)+","+up(d,hN).toFixed(1));
      }
      g.appendChild(el("polygon",{points:ris.concat(risB.slice().reverse()).join(" "),fill:"#101820",opacity:(0.5+t*0.055).toFixed(2)}));
      g.appendChild(el("polygon",{points:top.concat(ris.slice().reverse()).join(" "),fill:"#18222B",opacity:(0.55+t*0.05).toFixed(2)}));
      g.appendChild(el("polyline",{points:ris.join(" "),fill:"none",stroke:"#39454E","stroke-width":"1",opacity:(0.28+t*0.03).toFixed(2)}));
      var c=null,n=0;
      for(var dd=-0.04;dd<=1.38;dd+=0.062){
        var x=cxAt(dd,(uIn+0.13)*side),y=up(dd,h),s=Math.max(1.6,6.6*csc(dd)+1.1);
        if(x<-14||x>414) continue;
        if(!c||n>8){c=cluster();n=0;}
        person(c,x,y,s*(0.9+RND()*0.22),clamp(0.34+t*0.05,0,.86)); n++;
      }
    }
  }
  sideStand(-1); sideStand(1);
  var FD=[1.04,1.13,1.24,1.38,1.56,1.80,2.12,2.58,3.2], FH=[8,28,50,76,106,142,186,240,302];
  for(var i=FD.length-1;i>=0;i--){
    var d1=FD[i],h1=FH[i],d0=i>0?FD[i-1]:1.0,h0=i>0?FH[i-1]:0,a=[],b=[];
    for(var u=-4.6;u<=4.6;u+=0.2){
      a.push(cxAt(d0,u).toFixed(1)+","+up(d0,h0).toFixed(1));
      b.push(cxAt(d1,u).toFixed(1)+","+up(d1,h1).toFixed(1));
    }
    g.appendChild(el("polygon",{points:a.concat(b.slice().reverse()).join(" "),fill:"#141D25",opacity:(0.55+i*0.045).toFixed(2)}));
    g.appendChild(el("polyline",{points:b.join(" "),fill:"none",stroke:"#36424C","stroke-width":"1",opacity:".3"}));
    var c2=null,n2=0;
    for(var uu=-4.4;uu<=4.4;uu+=0.135+RND()*0.05){
      var x2=cxAt(d1,uu),y2=up(d1,h1),s2=Math.max(1.6,6.6*csc(d1)+1.1);
      if(x2<-14||x2>414||y2<8) continue;
      if(!c2||n2>8){c2=cluster();n2=0;}
      person(c2,x2+(RND()-.5)*2,y2,s2*(0.9+RND()*0.22),clamp(0.32+i*0.05,0,.85)); n2++;
    }
  }
  g.appendChild(el("rect",{x:14,y:82,width:372,height:124,rx:3,fill:"#05080B",opacity:".98"}));
  g.appendChild(el("rect",{x:14,y:82,width:372,height:124,rx:3,fill:"none",stroke:"#1E2831","stroke-width":"1.6"}));
})();

function racketWorld(P,arm,d,u,ang,leanAng){

var LED=(function(){
  var cv=document.getElementById("led"),ctx=cv.getContext("2d");
  var COLS=96,ROWS=27,LINEH=9;
  var cw=0,chh=0,cellW=0,cellH=0,base=null,grid=null,cur=null,reveal=1,tA=0;
  function layout(){
    var r=cv.getBoundingClientRect(); if(r.width<2) return;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    cw=Math.round(r.width*dpr); chh=Math.round(r.height*dpr);
    cv.width=cw; cv.height=chh; cellW=cw/COLS; cellH=chh/ROWS;
    base=document.createElement("canvas"); base.width=cw; base.height=chh;
    var b=base.getContext("2d");
    b.fillStyle="#080A0D"; b.fillRect(0,0,cw,chh);
    b.fillStyle="rgba(255,170,50,.05)";
    var rr=Math.min(cellW,cellH)*.32;

    draw();

    var words=text.split(" "),lines=[],line="";
    for(var i=0;i<words.length;i++){
      var tr=line?line+" "+words[i]:words[i];
      if(textWidth(tr)>COLS-2&&line){lines.push(line);line=words[i];}else line=tr;
    }
    if(line) lines.push(line);

  }
  function build(text){
    if(!text){grid=null;return;}
    var lines=wrap(text); grid=new Uint8Array(COLS*ROWS);
    var top=Math.round((ROWS-(lines.length*LINEH-2))/2);
    for(var li=0;li<lines.length;li++){
      var s=lines[li],x=Math.round((COLS-textWidth(s))/2),y0=top+li*LINEH;
      for(var i=0;i<s.length;i++){
        var gl=glyph(s[i]);

          if(gl.cols[c]&(1<<r)){var gx=x+c,gy=y0+r;if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS)grid[gy*COLS+gx]=1;}

})();

    rowA=document.getElementById("rowA"),rowB=document.getElementById("rowB"),
    badge=document.getElementById("badge"),hud=document.getElementById("hud"),
    speedEl=document.getElementById("speed");

/* loop */
var target=0,shown=0,lastShot=-1,bouncedAt=-1,served=false,servedSnd=false,running=true,ending=null;
var ask=document.getElementById("ask"),endc=document.getElementById("endc"),cue=document.getElementById("cue");
function onScroll(){
  var max=document.documentElement.scrollHeight-window.innerHeight;
  target=max>0?clamp(window.scrollY/max,0,1):0;
}
window.addEventListener("scroll",onScroll,{passive:true});
function phaseAt(p){for(var i=0;i<PH.length;i++){if(p<PH[i].e||i===PH.length-1)return PH[i];}return PH[PH.length-1];}

var SRV_D=0.70, SRV_U=-0.42;   /* lands inside the far deuce service box */

var gateDone={}, gateCap=1, gateOn=false;
function render(p){
  var ph=phaseAt(p), t=clamp((p-ph.s)/(ph.e-ph.s),0,1);
  camera(p,ph,t);
  if(ph.type==="shot"&&CONFIG.gates.indexOf(ph.i)>=0&&!gateDone[ph.i]&&t>=0.74){
    gateCap=ph.s+0.74*(ph.e-ph.s); gateOn=true; gateIdx=ph.i;
    document.getElementById("tapcue").classList.add("on");
  }
  if(ph.type==="shot"){
    var i=ph.i, fwd=(i%2===0), bh=isBackhand(i);
    LED.set(SHOTS[i].t);
    rowA.classList.toggle("lead",fwd); rowB.classList.toggle("lead",!fwd);
    ask.classList.remove("on"); ask.style.opacity=0; hud.classList.remove("hide");

    if(SHOTS[i].srv){
      /* ---- the serve ---- */
      nearU=SERVE_U; farU=lerp(0,SHOTS[0].u,ss(.30,.80,t));
      var ang=serveAng(t);
      var rS=placePlayer(pNear,D_NEAR,SERVE_U,0,false,ang);
      placePlayer(pFar,D_FAR,farU,0,false);
      var s=csc(D_NEAR)*1.02, bx=cxAt(D_NEAR,SERVE_U), by=cy(D_NEAR);
      var hand={x:bx-26*s,y:by-82*s}, peak={x:bx-14*s,y:by-300*s};
      var L=racketWorld(pNear,pNear.fh,D_NEAR,SERVE_U,serveAng(0.38),0);
      var B={x:cxAt(SRV_D,SRV_U),y:cy(SRV_D)};
      var x,y,gy,sc,air;
      if(t<0.30){ var k=1-Math.pow(1-t/0.30,2);
        x=lerp(hand.x,peak.x,k); y=lerp(hand.y,peak.y,k); gy=by; sc=s; air=1;
      }else if(t<0.38){ var k2=(t-0.30)/0.08;
        x=lerp(peak.x,rS.x,k2); y=lerp(peak.y,rS.y,k2); gy=by; sc=s; air=1;
        if(!servedSnd&&t>0.24){servedSnd=true;whoosh();}
      }else if(t<0.80){ var k3=(t-0.38)/0.42, e=1-Math.pow(1-k3,1.4);
        var dN=lerp(D_NEAR,SRV_D,e); sc=csc(dN); gy=cy(dN);
        x=lerp(L.x,B.x,e); y=lerp(L.y,B.y,e)-Math.sin(Math.PI*e)*34*sc; air=1-e*0.9;
        if(lastShot!==0){lastShot=0;racketHit(.95);grunt(1);}
        speedEl.classList.add("on");
      }else{ var k4=(t-0.80)/0.20, e2=Math.pow(k4,.9), arc=Math.sin(Math.PI*e2)*.62;
        var dN2=lerp(SRV_D,D_FAR,e2); sc=csc(dN2); gy=cy(dN2);
        var Rf=racketWorld(pFar,pFar.fh,D_FAR,SHOTS[0].u,armAngle(pFar.fh,ss(.86,1,t)),0);
        x=lerp(B.x,Rf.x,e2); y=lerp(B.y,Rf.y,e2)-arc*170*sc; air=arc;
        if(bouncedAt!==0){bouncedAt=0;bounceSnd();squash=.48;puff(B.x,B.y,csc(SRV_D));}
        speedEl.classList.remove("on");
      }
      drawBall(x,y,gy,sc,air);
      crowd(.04,.3); cue.classList.remove("on");
      return;
    }

    /* ---- groundstroke ---- */
    var uFrom=hitterU(i), uTo=SHOTS[i].u, prev2=(i>=2)?SHOTS[i-2].u:0;
    if(fwd){ nearU=uFrom; farU=lerp(prev2,uTo,ss(.05,.60,t)); }
    else   { farU=uFrom;  nearU=lerp(prev2,uTo,ss(.05,.60,t)); }
    var swH=ss(0,.16,t), swR=ss(.84,1,t);
    var rN=placePlayer(pNear,D_NEAR,nearU,fwd?swH:swR,fwd?bh:isBackhand(i+1));
    var rF=placePlayer(pFar ,D_FAR ,farU ,fwd?swR:swH,fwd?isBackhand(i+1):bh);
    var A=fwd?rN:rF, B2=fwd?rF:rN;
    var dA=fwd?D_NEAR:D_FAR, dB=fwd?D_FAR:D_NEAR, dG=fwd?0.78:0.22;
    var uG=clamp(uTo*0.94,-0.76,0.76);
    var G={x:cxAt(dG,uG),y:cy(dG)};
    var x2,y2,gy2,sc2,air2,dd;
    if(t<.68){
      var kk=t/.68, ek=1-Math.pow(1-kk,1.35), arcA=Math.sin(Math.PI*Math.pow(ek,1.15));
      dd=lerp(dA,dG,ek); sc2=csc(dd); gy2=cy(dd);
      x2=lerp(A.x,G.x,ek); y2=lerp(A.y,G.y,ek)-arcA*235*sc2; air2=arcA;
    }else{
      var k5=(t-.68)/.32, ek2=Math.pow(k5,.9), arcB=Math.sin(Math.PI*ek2)*.5;
      dd=lerp(dG,dB,ek2); sc2=csc(dd); gy2=cy(dd);
      x2=lerp(G.x,B2.x,ek2); y2=lerp(G.y,B2.y,ek2)-arcB*150*sc2; air2=arcB;
      if(bouncedAt!==i&&k5>.005){bouncedAt=i;bounceSnd();squash=.42;}
    }
    drawBall(x2,y2,gy2,sc2,air2);
    if(i!==lastShot&&t>.008){
      lastShot=i; bouncedAt=-1; racketHit(fwd?.62:.52); squash=.3;
      if(SHOTS[i].w>=1.05) grunt(.8);
    }
    crowd(.05+air2*.03,.25); cue.classList.remove("on");

  }else if(ph.type==="change"){
    var last=SHOTS.length-1,endU=SHOTS[last].u;
    nearU=lerp(endU,0,ss(0,.7,t)); farU=lerp(SHOTS[last-1].u,0,ss(0,.7,t));
    placePlayer(pNear,D_NEAR,nearU,0,false); placePlayer(pFar,D_FAR,farU,0,false);
    var dr=lerp(D_NEAR,0.42,ss(0,.66,t)),ur=lerp(endU,0,ss(0,.66,t));
    var scr=csc(dr),gyr=cy(dr),hop=Math.abs(Math.sin(t*Math.PI*6))*5*scr*(1-t);
    drawBall(cxAt(dr,ur),gyr-hop,gyr,scr,0);
    LED.set(t<.5?"MATCH POINT":"ADVANTAGE ABHI");
    rowA.classList.add("lead"); rowB.classList.remove("lead");
    crowd(.014,1);
    ask.classList.remove("on"); ask.style.opacity=0; cue.classList.remove("on");
    hud.classList.remove("hide");

  }else{
    nearU=lerp(nearU,0,.12); farU=lerp(farU,0,.12);
    var r2=placePlayer(pNear,D_NEAR,0,ss(.02,.18,t),false);
    placePlayer(pFar,D_FAR,0,0,false);
    var dm=0.5,scm=csc(dm),rise=ss(0,.66,t);
    drawBall(lerp(r2.x,cxAt(dm,0),ss(0,.5,t)),lerp(r2.y,cy(dm)-350*scm,rise),
             cy(dm),lerp(csc(D_NEAR),scm,rise),rise);
    if(t<.34) LED.set(CONFIG.board.a);
    else LED.set(CONFIG.board.b);
    rowA.classList.add("lead"); rowB.classList.remove("lead");
    crowd(.006,1.4);
    var show=ss(.58,.92,t);
    ask.style.opacity=show;
    if(show>.9){ask.classList.add("on");hud.classList.add("hide");}
    else{ask.classList.remove("on");hud.classList.remove("hide");}
    cue.classList.toggle("on",served&&show<.08&&t<.02);
  }
}
var gateIdx=-1, capT0=0;
function tick(){
  if(CAPTURE&&served&&running){
    if(!capT0) capT0=performance.now();
    target=clamp((performance.now()-capT0)/46000,0,1);
    if(gateOn){ gateDone[gateIdx]=true; gateOn=false;
      document.getElementById("tapcue").classList.remove("on"); racketHit(.6); }
  }
  if(gateOn) target=Math.min(target,gateCap);
  if(running){
    shown+=(target-shown)*0.11;
    if(Math.abs(target-shown)<0.00004) shown=target;
    render(shown);
  }else if(ending){ ending(); }
  LED.step();
  requestAnimationFrame(tick);
}

function cheer(on){for(var i=0;i<clusters.length;i++) clusters[i].classList.toggle("cheering",on);}
function flashes(ms){
  var t0=performance.now();
  (function loop(){
    if(performance.now()-t0>ms) return;
    for(var i=0;i<6;i++){
      var d,u;
      if(Math.random()<.5){d=1.04+Math.random()*2.2;u=Math.random()*8-4;}
      else{d=Math.random()*1.35;u=(Math.random()<.5?-1:1)*(1.3+Math.random()*2.2);}
      var x=cxAt(d,u),y=up(d,Math.random()*160);
      if(x<-10||x>410||y<6||y>880) continue;
      var f=el("circle",{cx:x,cy:y,r:2.6,fill:"#FFF8E8",opacity:.95});
      flashG.appendChild(f);
      (function(f){setTimeout(function(){f.setAttribute("opacity",0);setTimeout(function(){f.remove();},220);},70+Math.random()*90);})(f);
    }
    setTimeout(loop,85);
  })();
}

function finish(kind){
  running=false; ask.classList.remove("on"); ask.style.opacity=0;
  hud.classList.remove("hide");
  var t0=performance.now(),dm=0.5,scm=csc(dm);
  var x0=cxAt(dm,0),y0=cy(dm)-350*scm,dEnd=kind==="yes"?0.86:0.46,landed=false;
  LED.set(kind==="yes"?"SHE SAID YES":"DEUCE");
  ending=function(){
    var k=clamp((performance.now()-t0)/1150,0,1),e=k*k;
    var d=lerp(dm,dEnd,ss(0,1,k)),sc=csc(d),gy=cy(d);
    drawBall(lerp(x0,cxAt(d,0),ss(0,1,k)),lerp(y0,gy,e),gy,sc,1-e);
    if(!landed&&k>=.995){
      landed=true; squash=.5; puff(cxAt(d,0),gy,sc); racketHit(.9);
      chime();
      if(kind==="yes"){
        gA.textContent="6"; pA.textContent="\u2013"; pB.textContent="\u2013";
        pA.classList.add("win");
        badge.textContent="Game, set, match"; badge.className="badge won";
        applause(); crowd(.12,.4); cheer(true); flashes(4500);
        setTimeout(function(){cheer(false);crowd(.05,2);LED.set("SO. WHERE?");},3400);
        setTimeout(function(){document.getElementById("pick").classList.add("on");hud.classList.add("hide");},3900);
        ending=null; return;
      }else{
        pA.textContent="40"; pB.textContent="40";
        badge.textContent="Deuce"; badge.className="badge deuce";
        claps(9); crowd(.035,.9);
        setTimeout(function(){LED.set("DEUCE. WE GO AGAIN.");},1400);
      }
      setTimeout(function(){endc.classList.add("on");},760);
      ending=null;
    }
  };
}

document.getElementById("stage").addEventListener("pointerdown",function(){
  if(!gateOn) return;
  gateDone[gateIdx]=true; gateOn=false;
  document.getElementById("tapcue").classList.remove("on");
  racketHit(.8); grunt(.7);
});
var intro=document.getElementById("intro");
document.getElementById("btnServe").addEventListener("click",function(){
  initAudio(); if(AC&&AC.state==="suspended") AC.resume();
  crowd(.05,1.2); chime();
  intro.classList.add("gone");
  setTimeout(function(){intro.style.display="none";},950);
  served=true; cue.classList.add("on");
});
if(CAPTURE) setTimeout(function(){
  document.getElementById("btnServe").click();
  var iv=setInterval(function(){
    if(document.getElementById("ask").classList.contains("on")){
      clearInterval(iv); document.getElementById("btnYes").click();
      setTimeout(function(){
        var b=document.querySelector('.venue[data-v="0"]'); if(b) b.click();
      },5200);
    }
  },300);
},900);
var sndBtn=document.getElementById("snd");
sndBtn.addEventListener("click",function(){
  soundOn=!soundOn; sndBtn.textContent=soundOn?"On":"Off";
  if(master) master.gain.value=soundOn?.9:0;
});
document.getElementById("btnYes").addEventListener("click",function(){ finish("yes"); });
document.getElementById("btnAgain").addEventListener("click",function(){
  document.getElementById("verdict").textContent=CONFIG.deuce.verdict;
  document.getElementById("endLine1").textContent=CONFIG.deuce.l1;
  document.getElementById("endLine2").textContent=CONFIG.deuce.l2;
  finish("again");
});
var VENUES=CONFIG.venues;
document.getElementById("btnCard").addEventListener("click",function(){
  document.getElementById("card").classList.add("on");
});
document.getElementById("card").addEventListener("click",function(){
  this.classList.remove("on");
});
document.getElementById("btnShare").addEventListener("click",function(e){
  e.stopPropagation();
  var btn=this;
  var shareData={
    title:"Game. Set. Match. — Abhi & Mounika",
    text:"Game. Set. Match. 🎾 See how Abhi and Mounika's story played out on Centre Court.",
    url:location.origin+location.pathname
  };
  if(navigator.share){
    navigator.share(shareData).catch(function(err){
      if(err&&err.name!=="AbortError") copyShareLink(btn,shareData.url);
    });
  }else{
    copyShareLink(btn,shareData.url);
  }
});
function copyShareLink(btn,url){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){showShareResult(btn,"Link copied");});
  }else{
    window.prompt("Copy this link to share",url);
  }
}
function showShareResult(btn,label){
  var old=btn.textContent; btn.textContent=label;
  setTimeout(function(){btn.textContent=old;},1800);
}
Array.prototype.forEach.call(document.querySelectorAll(".venue"),function(b){
  b.addEventListener("click",function(){
    var v=VENUES[+b.getAttribute("data-v")];
    document.getElementById("pick").classList.remove("on");
    LED.set(v.led); chime(); claps(6);
    document.getElementById("verdict").textContent="Game. Set. Match.";
    document.getElementById("endLine1").textContent=v.l1;
    document.getElementById("endLine2").textContent=v.l2;
    document.getElementById("cardMeta").textContent=v.l1;
    document.getElementById("cardRes").textContent="6-4 \u00b7 Game, set, match";
    setTimeout(function(){endc.classList.add("on");},700);
    if(CAPTURE) setTimeout(function(){endc.classList.remove("on");document.getElementById("card").classList.add("on");},3200);
  });
});
document.getElementById("btnReset").addEventListener("click",function(){
  endc.classList.remove("on"); document.getElementById("pick").classList.remove("on");
  cheer(false); window.scrollTo(0,0);
  target=0;shown=0;lastShot=-1;bouncedAt=-1;ending=null;hist=[];servedSnd=false;
  gA.textContent="5"; pA.textContent="AD"; pB.textContent="\u2013";
  pA.classList.remove("win"); badge.textContent="Match point"; badge.className="badge";
  document.getElementById("card").classList.remove("on");
  gateDone={}; gateOn=false; gateIdx=-1; VB={x:0,y:0,w:400,h:900};
  document.getElementById("tapcue").classList.remove("on");
  running=true; crowd(.05,.8); chime();
});


/* ---- apply CONFIG to the DOM ---- */
(function(){
  document.getElementById("brief").textContent=CONFIG.brief;
  document.getElementById("askText").textContent=CONFIG.ask;
  document.getElementById("credit").textContent=CONFIG.studio.name;
  document.getElementById("cardFoot").textContent=CONFIG.studio.name;
  document.getElementById("cardA").textContent=CONFIG.players.near;
  document.getElementById("cardB").textContent=CONFIG.players.far;
  rowA.querySelector(".who").textContent=CONFIG.players.near;
  rowB.querySelector(".who").textContent=CONFIG.players.far;
  var iv=document.querySelectorAll(".intro .vs span");
  iv[0].textContent=CONFIG.players.near; iv[2].textContent=CONFIG.players.far;
})();
positionBoard(); onScroll(); render(0); tick();
setTimeout(positionBoard,350);
setTimeout(function(){positionBoard();LED.redraw();},1200);
})();
</script>
</body>
</html>
